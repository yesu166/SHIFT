name: SHIFT CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Inspect dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.metadata?.vulnerabilities; console.log(JSON.stringify({metadata:v, packages:Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,range:x.range,fixAvailable:x.fixAvailable}))}, null, 2)); if ((v?.total ?? 0) > 0) process.exit(1)"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload dependency resolution and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-resolution
          path: |
            package-lock.json
            npm-audit.json

  rust:
    name: Rust engine checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm ci
      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Rust unit and integration tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build Windows x64 NSIS installer
        run: npm run tauri:build
      - name: Measure installer and upload build artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was produced." }
          Write-Host "Installer: $($installer.Name)"
          Write-Host "Installer size bytes: $($installer.Length)"
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: shift-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-resolution
          path: src-tauri/Cargo.lock


  lockfiles:
    name: Resolve and commit dependency lockfiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/shift-windows-app'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Generate resolved lockfiles
        run: |
          npm install --package-lock-only
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfiles if this run is still at branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced during CI; skipping automatic lockfile commit."
            exit 0
          fi
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock resolved npm and Cargo dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
