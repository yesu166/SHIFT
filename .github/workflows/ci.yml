name: SHIFT CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Inspect dependency advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload dependency resolution and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-resolution
          path: |
            package-lock.json
            npm-audit.json

  rust:
    name: Rust engine checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        run: npm install
      - name: Format Rust sources
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Rust unit and integration tests
        working-directory: src-tauri
        run: cargo test --all-targets
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Upload Cargo lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-resolution
          path: src-tauri/Cargo.lock
