[package]
name = "shift"
version = "0.1.0"
description = "A local-first Windows document toolbox"
authors = ["SHIFT contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "shift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
open = "5.3.2"
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-plugin-dialog = "2"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
